name: Machine events
description: Publish a repository change hint to Tommy's global machine event channel.
inputs:
  topic:
    description: Unguessable ntfy topic shared by the machines.
    required: true
  published:
    description: Set true after pushing generated marketplace packages with GITHUB_TOKEN.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Publish the hint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MACHINE_EVENTS_TOPIC: ${{ inputs.topic }}
        MACHINE_EVENTS_PUBLISHED: ${{ inputs.published }}
      run: |
        python=$(command -v python3 || command -v python)
        "$python" -B "$GITHUB_ACTION_PATH/../../../.agents/github-actions/utility/machine-events/scripts/publish.py"
