name: Merge policy check
description: Fail when the default branch's enforced GitHub rules or the agent merge denials differ from the merge policy.

inputs:
  configuration:
    description: Path of the repository configuration in the checked-out repository; without a merge section there, the owner's <owner>/.github default applies.
    default: .agents/repository.json
  harness:
    description: Path of the repository harness overlay that carries the agent merge denials.
    default: .agents/repository-harness.json
  token:
    description: Token that can read the repository's rules and, when the owner default applies, the owner's .github repository.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Compare enforced rules with the merge policy
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CONFIGURATION: ${{ inputs.configuration }}
        HARNESS: ${{ inputs.harness }}
      run: |
        set -euo pipefail
        python=$(command -v python3 || command -v python)
        "$python" -B "$GITHUB_ACTION_PATH/../../../.agents/github-actions/utility/merge-policy/scripts/merge_policy.py" \
          check --repo "$GITHUB_REPOSITORY" --configuration "$CONFIGURATION" --harness "$HARNESS"
