name: Enroll and bootstrap publishers

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: enroll-publishers
  cancel-in-progress: false

jobs:
  enroll:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: update-enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      repositories: ${{ steps.enroll.outputs.repositories }}
    steps:
      - name: Check out trusted central source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked enrollment dependencies
        run: uv sync --locked
      - name: Mint controller installation token
        id: controller
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ENROLLMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENROLLMENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-administration: write
          permission-environments: write
          permission-secrets: read
      - name: Enroll eligible repositories
        id: enroll
        env:
          GH_TOKEN: ${{ steps.controller.outputs.token }}
          EXPECTED_ENROLLMENT_OWNER: ${{ github.repository_owner }}
          ENROLLMENT_APP_ID: ${{ vars.ENROLLMENT_APP_ID }}
          ENROLLMENT_APP_CLIENT_ID: ${{ vars.ENROLLMENT_APP_CLIENT_ID }}
          UPDATE_APP_CLIENT_ID: ${{ vars.UPDATE_APP_CLIENT_ID }}
          UPDATE_APP_ID: ${{ vars.UPDATE_APP_ID }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          CENTRAL_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: >-
          uv run --locked python -B
          .agents/github-actions/utility/publish-update/scripts/enrollment.py
          --owner "$GITHUB_REPOSITORY_OWNER"
          --repository "$CENTRAL_REPOSITORY_NAME"
          --updater-client-id "$UPDATE_APP_CLIENT_ID"
          --updater-app-id "$UPDATE_APP_ID"
          --apply
          --matrix-output "$GITHUB_OUTPUT"

  bootstrap:
    needs: enroll
    if: >-
      needs.enroll.outputs.repositories != '[]'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: update-enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.enroll.outputs.repositories) }}
    steps:
      - name: Check out trusted central source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Mint repository-scoped updater token
        id: updater
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Check out consumer repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ format('{0}/{1}', github.repository_owner, matrix.name) }}
          path: consumer
          token: ${{ steps.updater.outputs.token }}
          persist-credentials: false
      - name: Update pins and migrate exact callers
        uses: ./automation/.github/actions/update-pins
        with:
          token: ${{ steps.updater.outputs.token }}
          repositories: tj-agents/github-actions
          path: consumer
          repository: ${{ format('{0}/{1}', github.repository_owner, matrix.name) }}
          bootstrap-callers: 'true'
