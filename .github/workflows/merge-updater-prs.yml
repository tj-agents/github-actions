name: Merge Verified Updater Pull Requests

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Enroll publishers]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: merge-updater-prs
  cancel-in-progress: false

jobs:
  merge:
    name: Merge verified updater pull requests
    if: >-
      github.event_name != 'workflow_run'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    environment: update-enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted central source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked merger dependencies
        run: uv sync --locked
      - name: Mint updater installation token
        id: updater
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write
      - name: Merge exactly generated updater pull requests
        env:
          GH_TOKEN: ${{ steps.updater.outputs.token }}
          UPDATER_APP_SLUG: ${{ steps.updater.outputs.app-slug }}
        run: >-
          uv run --locked python -B
          .agents/github-actions/utility/publish-update/scripts/merge_updater_prs.py
          --owner "$GITHUB_REPOSITORY_OWNER"
          --updater-app-slug "$UPDATER_APP_SLUG"
