name: Publish update
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_call:
    secrets:
      UPDATE_TOPIC:
        required: false
permissions:
  contents: read
concurrency:
  group: publish-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      vars.UPDATE_TOPIC != '' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish repository update
        uses: tj-agents/github-actions/.github/actions/publish-update@ab1ac0d9ede30d2fe94a6df5fab6cada06f84e7e
        with:
          topic: ${{ secrets.UPDATE_TOPIC }}
